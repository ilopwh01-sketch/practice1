<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Bubble and Delamination Process Window</title>
  <desc id="desc">Schematic explanation of bubble and delamination failure modes in PV module laminate stack.</desc>
  <rect width="960" height="520" fill="#f5f7f9"/>
  <text x="40" y="54" font-family="Malgun Gothic, Arial" font-size="28" font-weight="700" fill="#17202a">Bubble / Delamination 원인 해석 도식</text>
  <text x="40" y="88" font-family="Malgun Gothic, Arial" font-size="15" fill="#5d6b78">라미네이션 Stack과 공정 Profile을 연결해 원인 후보를 좁히는 설명 이미지</text>

  <g transform="translate(70 128)">
    <rect x="0" y="0" width="470" height="280" rx="8" fill="#ffffff" stroke="#d9e1e8"/>
    <text x="24" y="36" font-family="Malgun Gothic, Arial" font-size="20" font-weight="700" fill="#17202a">PV Module Stack</text>
    <rect x="50" y="70" width="360" height="36" rx="4" fill="#b8d7ef" stroke="#1769aa"/>
    <text x="430" y="94" font-family="Malgun Gothic, Arial" font-size="14" fill="#5d6b78">Glass</text>
    <rect x="50" y="108" width="360" height="34" rx="4" fill="#f7e4b3" stroke="#b85b18"/>
    <text x="430" y="131" font-family="Malgun Gothic, Arial" font-size="14" fill="#5d6b78">EVA</text>
    <rect x="50" y="144" width="360" height="42" rx="4" fill="#26313d" stroke="#17202a"/>
    <g stroke="#dce7ee" opacity="0.25">
      <line x1="92" y1="144" x2="92" y2="186"/><line x1="134" y1="144" x2="134" y2="186"/><line x1="176" y1="144" x2="176" y2="186"/><line x1="218" y1="144" x2="218" y2="186"/><line x1="260" y1="144" x2="260" y2="186"/><line x1="302" y1="144" x2="302" y2="186"/><line x1="344" y1="144" x2="344" y2="186"/>
    </g>
    <text x="430" y="170" font-family="Malgun Gothic, Arial" font-size="14" fill="#5d6b78">Cell</text>
    <rect x="50" y="188" width="360" height="34" rx="4" fill="#f7e4b3" stroke="#b85b18"/>
    <text x="430" y="211" font-family="Malgun Gothic, Arial" font-size="14" fill="#5d6b78">EVA</text>
    <rect x="50" y="224" width="360" height="36" rx="4" fill="#e9eef2" stroke="#9da8b2"/>
    <text x="430" y="248" font-family="Malgun Gothic, Arial" font-size="14" fill="#5d6b78">Backsheet</text>

    <ellipse cx="162" cy="126" rx="34" ry="15" fill="#ffffff" opacity="0.8" stroke="#b85b18" stroke-width="3"/>
    <text x="105" y="306" font-family="Malgun Gothic, Arial" font-size="14" fill="#5d6b78">Bubble: trapped air / moisture / insufficient vacuum</text>
    <path d="M270 107 C312 104, 342 111, 380 108" fill="none" stroke="#b83a3a" stroke-width="5" stroke-linecap="round"/>
    <text x="105" y="332" font-family="Malgun Gothic, Arial" font-size="14" fill="#5d6b78">Delamination: adhesion loss at interface</text>
  </g>

  <g transform="translate(590 128)">
    <rect x="0" y="0" width="300" height="280" rx="8" fill="#ffffff" stroke="#d9e1e8"/>
    <text x="24" y="36" font-family="Malgun Gothic, Arial" font-size="20" font-weight="700" fill="#17202a">확인할 공정 데이터</text>
    <g font-family="Malgun Gothic, Arial" font-size="15" fill="#17202a">
      <circle cx="38" cy="78" r="9" fill="#b83a3a"/><text x="58" y="84">vacuum_kpa 하락</text>
      <circle cx="38" cy="118" r="9" fill="#b85b18"/><text x="58" y="124">lamination_temp_c 상승/이탈</text>
      <circle cx="38" cy="158" r="9" fill="#1769aa"/><text x="58" y="164">pressure_mpa 변동</text>
      <circle cx="38" cy="198" r="9" fill="#1f8a5b"/><text x="58" y="204">cycle/cooling time 변화</text>
      <circle cx="38" cy="238" r="9" fill="#415161"/><text x="58" y="244">visual_bubble_count 증가</text>
    </g>
  </g>

  <text x="40" y="474" font-family="Malgun Gothic, Arial" font-size="14" fill="#5d6b78">대시보드 적용: Bubble/Delamination 후보는 외관 결함만 보지 않고 진공도, 온도, 압력, 냉각 시간, Encapsulant/Lot 정보를 함께 확인</text>
</svg>
